# Starter pipeline
trigger:
 - none

pool:
  vmImage: ubuntu-latest

# Define the pipeline resource with an alias
resources:
  pipelines:
  - pipeline: build-pipeline  # This is the alias
    source: VojtaKai.kubernetes-build  # The name of the build pipeline
    branch: refs/heads/release-cd-pipeline  # or the branch your build pipeline uses
    trigger: none

variables:
  buildRunId: $(resources.pipeline.build-pipeline.runID)

